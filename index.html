<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>내전서버 관리</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23071318'/%3E%3Cpath d='M13 42 27 12h10l14 30-9 8-10-23-10 23z' fill='%2338bdf8'/%3E%3Cpath d='M21 49h22v5H21z' fill='%23facc15'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="top-controls">
      <button class="patch-button" id="patchNoteButton" type="button">패치노트</button>
      <div class="user-menu-wrap">
        <button class="auth-button" id="authOpenButton" type="button">로그인</button>
        <div class="user-menu" id="userMenu">
          <button type="button" id="openRenameButton">이름 변경</button>
          <button type="button" id="logoutButton">로그아웃</button>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button">다크모드</button>
    </div>

    <main class="app-shell">
      <div class="screen-menu">
        <button class="menu-toggle" id="menuToggle" type="button">화면 변경 🔄</button>
      </div>

      <nav class="tabs" id="screenTabs" aria-label="화면 변경">
        <button class="tab active" type="button" data-view="inhouse">내전 관리</button>
        <button class="tab" type="button" data-view="auction">경매</button>
        <button class="tab" type="button" data-view="tier">티어표</button>
        <button class="tab" type="button" data-view="admin">관리자</button>
      </nav>

      <section class="view active" id="inhouseView">
        <section class="manager-grid single-grid">
          <article class="panel">
            <div class="section-head">
              <div>
                <h2>멤버 명단</h2>
              </div>
            </div>
            <div class="player-list" id="playerList"></div>
          </article>
        </section>

        <section class="manager-grid bottom-grid">
          <article class="panel">
            <h2>내전 랭킹</h2>
            <div class="ranking-table" id="rankingTable"></div>
          </article>
          <article class="panel">
            <h2>경기 기록</h2>
            <div class="history-list" id="historyList"></div>
          </article>
        </section>
      </section>

      <section class="view tool-view" id="auctionView">
        <iframe title="경매 프로그램" src="./auction/index.html"></iframe>
      </section>

      <section class="view tool-view" id="tierView">
        <iframe title="티어표" src="./tier/index.html"></iframe>
      </section>

      <section class="view" id="adminView">
        <section class="admin-lock panel" id="adminLock">
          <h2>관리자</h2>
          <p>관리자 비밀번호를 입력하세요.</p>
          <div class="admin-password-row">
            <input id="adminPasswordInput" type="password" placeholder="비밀번호" />
            <button id="adminUnlockButton" type="button">입장</button>
          </div>
          <p class="auth-message" id="adminMessage"></p>
        </section>

        <section class="admin-content" id="adminContent" hidden>
          <article class="panel">
            <div class="section-head">
              <div>
                <h2>내전 결과 입력</h2>
              </div>
              <div class="row-actions">
                <button class="ghost" id="resetRankingButton" type="button">랭킹 초기화</button>
              </div>
            </div>
            <form class="match-form" id="inhouseMatchForm">
              <div class="match-team-picker">
                <span class="team-label blue">블루팀</span>
                <div class="line-select-grid">
                  <label><span>탑</span><select data-match-team="blue" data-match-lane="탑"></select></label>
                  <label><span>정글</span><select data-match-team="blue" data-match-lane="정글"></select></label>
                  <label><span>미드</span><select data-match-team="blue" data-match-lane="미드"></select></label>
                  <label><span>원딜</span><select data-match-team="blue" data-match-lane="원딜"></select></label>
                  <label><span>서폿</span><select data-match-team="blue" data-match-lane="서폿"></select></label>
                </div>
              </div>
              <div class="match-team-picker">
                <span class="team-label red">레드팀</span>
                <div class="line-select-grid">
                  <label><span>탑</span><select data-match-team="red" data-match-lane="탑"></select></label>
                  <label><span>정글</span><select data-match-team="red" data-match-lane="정글"></select></label>
                  <label><span>미드</span><select data-match-team="red" data-match-lane="미드"></select></label>
                  <label><span>원딜</span><select data-match-team="red" data-match-lane="원딜"></select></label>
                  <label><span>서폿</span><select data-match-team="red" data-match-lane="서폿"></select></label>
                </div>
              </div>
              <label>
                <span>승리팀</span>
                <select id="winnerInput">
                  <option value="blue">블루팀</option>
                  <option value="red">레드팀</option>
                </select>
              </label>
              <label>
                <span>메모</span>
                <input id="matchMemoInput" placeholder="예: 1세트, 결승, 밴픽 이슈" />
              </label>
              <p class="auth-message match-message" id="matchFormMessage"></p>
              <button type="submit">결과 저장</button>
            </form>
          </article>

          <article class="panel">
            <div class="section-head">
              <h2>경기 기록 삭제</h2>
            </div>
            <div class="admin-history-list" id="adminHistoryList"></div>
          </article>

          <article class="panel">
            <div class="section-head">
              <h2>참가자 관리</h2>
              <button class="ghost" id="clearPlayersButton" type="button">전체 삭제</button>
            </div>
            <form class="inline-form" id="playerForm">
              <input id="playerNameInput" placeholder="닉네임" required />
              <select id="playerTierInput">
                <option>아이언</option>
                <option>브론즈</option>
                <option>실버</option>
                <option>골드</option>
                <option>플래티넘</option>
                <option>에메랄드</option>
                <option>다이아</option>
                <option>마스터+</option>
              </select>
              <select id="playerLaneInput">
                <option>탑</option>
                <option>정글</option>
                <option>미드</option>
                <option>원딜</option>
                <option>서폿</option>
                <option>상관없음</option>
              </select>
              <button type="submit">추가</button>
            </form>
            <div class="player-list admin-player-list" id="adminPlayerList"></div>
          </article>
        </section>
      </section>
    </main>

    <div class="patch-modal" id="patchModal" aria-hidden="true">
      <section class="patch-card" aria-label="패치노트">
        <button class="auth-close" id="patchCloseButton" type="button">닫기</button>
        <div class="patch-note-heading">
          <h2>패치노트</h2>
        </div>
        <div class="patch-note-layout">
          <aside class="patch-version-panel" aria-label="버전 선택">
            <strong>버전 선택</strong>
            <button class="patch-version-button is-active" type="button">beta 1.0</button>
          </aside>
          <section class="patch-content-panel">
            <h3>beta 1.0 업데이트</h3>
            <div class="patch-version-content">
              <ul>
                <li>레몬방 내전 관리 사이트 운영 시작합니다 역시 정희석이야</li>
              </ul>
            </div>
          </section>
        </div>
      </section>
    </div>

    <div class="rename-modal" id="renameModal" aria-hidden="true">
      <section class="auth-card" aria-label="이름 변경">
        <button class="auth-close" id="renameCloseButton" type="button">닫기</button>
        <div class="auth-pane active">
          <h2>이름 변경</h2>
          <label for="renameNameInput">변경할 이름</label>
          <input id="renameNameInput" type="text" maxlength="18" autocomplete="nickname" />
          <label for="renamePasswordInput">비밀번호</label>
          <input id="renamePasswordInput" type="password" autocomplete="current-password" />
          <p class="auth-message" id="renameMessage"></p>
          <div class="auth-actions">
            <button class="ghost" id="renameCancelButton" type="button">취소</button>
            <button id="renameSaveButton" type="button">변경</button>
          </div>
        </div>
      </section>
    </div>

    <div class="auth-modal" id="authModal" aria-hidden="true">
      <section class="auth-card" aria-label="로그인">
        <button class="auth-close" id="authCloseButton" type="button">닫기</button>

        <div class="auth-pane active" id="loginPane">
          <h2>로그인</h2>
          <label for="loginUsername">이메일</label>
          <input id="loginUsername" type="email" autocomplete="email" />
          <label for="loginPassword">비밀번호</label>
          <div class="password-row">
            <input id="loginPassword" type="password" autocomplete="current-password" />
            <button class="ghost" id="toggleLoginPassword" type="button">보기</button>
          </div>
          <p class="auth-message" id="loginMessage"></p>
          <div class="auth-actions">
            <button class="ghost" id="showSignupButton" type="button">회원가입</button>
            <button id="loginButton" type="button">로그인</button>
          </div>
        </div>

        <div class="auth-pane" id="signupPane">
          <h2>회원가입</h2>
          <label for="signupUsername">이메일</label>
          <input id="signupUsername" type="email" autocomplete="email" />
          <label for="signupPassword">비밀번호</label>
          <div class="password-row">
            <input id="signupPassword" type="password" autocomplete="new-password" />
            <button class="ghost" id="toggleSignupPassword" type="button">보기</button>
          </div>
          <p class="auth-message" id="signupMessage"></p>
          <div class="auth-actions">
            <button class="ghost" id="showLoginButton" type="button">로그인으로</button>
            <button id="signupButton" type="button">가입하기</button>
          </div>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
