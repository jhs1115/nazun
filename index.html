<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NAZUN 내전 허브</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23071318'/%3E%3Cpath d='M13 42 27 12h10l14 30-9 8-10-23-10 23z' fill='%2338bdf8'/%3E%3Cpath d='M21 49h22v5H21z' fill='%23facc15'/%3E%3C/svg%3E" />
  </head>
  <body>
    <main class="app-shell">
      <div class="screen-menu">
        <button class="menu-toggle" id="menuToggle" type="button">화면 변경</button>
      </div>

      <nav class="tabs" id="screenTabs" aria-label="화면 변경">
        <button class="tab active" type="button" data-view="inhouse">내전 관리</button>
        <button class="tab" type="button" data-view="auction">경매</button>
        <button class="tab" type="button" data-view="tier">티어표</button>
      </nav>

      <section class="view active" id="inhouseView">
        <section class="command-strip">
          <article class="command-card">
            <span>참가자</span>
            <strong id="memberCount">0명</strong>
          </article>
          <article class="command-card">
            <span>기록된 경기</span>
            <strong id="recordCount">0경기</strong>
          </article>
          <article class="command-card">
            <span>운영 도구</span>
            <strong>경매 / 티어표</strong>
          </article>
        </section>

        <section class="manager-grid">
          <article class="panel">
            <div class="section-head">
              <div>
                <h2>참가자 관리</h2>
              </div>
              <button class="ghost" id="clearPlayersButton" type="button">초기화</button>
            </div>
            <form class="inline-form" id="playerForm">
              <input id="playerNameInput" placeholder="닉네임" required />
              <select id="playerTierInput">
                <option>아이언</option>
                <option>브론즈</option>
                <option>실버</option>
                <option>골드</option>
                <option>플래티넘</option>
                <option>에메랄드</option>
                <option>다이아</option>
                <option>마스터+</option>
              </select>
              <select id="playerLaneInput">
                <option>탑</option>
                <option>정글</option>
                <option>미드</option>
                <option>원딜</option>
                <option>서폿</option>
                <option>상관없음</option>
              </select>
              <button type="submit">추가</button>
            </form>
            <div class="player-list" id="playerList"></div>
          </article>

          <article class="panel">
            <div class="section-head">
              <div>
                <h2>내전 결과 입력</h2>
              </div>
              <button class="ghost" id="clearMatchesButton" type="button">기록 삭제</button>
            </div>
            <form class="match-form" id="inhouseMatchForm">
              <label>
                <span>블루팀</span>
                <textarea id="blueTeamInput" rows="4" placeholder="한 줄에 한 명씩 입력"></textarea>
              </label>
              <label>
                <span>레드팀</span>
                <textarea id="redTeamInput" rows="4" placeholder="한 줄에 한 명씩 입력"></textarea>
              </label>
              <label>
                <span>승리팀</span>
                <select id="winnerInput">
                  <option value="blue">블루팀</option>
                  <option value="red">레드팀</option>
                </select>
              </label>
              <label>
                <span>메모</span>
                <input id="matchMemoInput" placeholder="예: 1세트, 결승, 밴픽 이슈" />
              </label>
              <button type="submit">결과 저장</button>
            </form>
          </article>
        </section>

        <section class="manager-grid bottom-grid">
          <article class="panel">
            <h2>내전 랭킹</h2>
            <div class="ranking-table" id="rankingTable"></div>
          </article>
          <article class="panel">
            <h2>경기 기록</h2>
            <div class="history-list" id="historyList"></div>
          </article>
        </section>
      </section>

      <section class="view tool-view" id="auctionView">
        <iframe title="경매 프로그램" src="./auction/index.html"></iframe>
      </section>

      <section class="view tool-view" id="tierView">
        <iframe title="티어표" src="./tier/index.html"></iframe>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
